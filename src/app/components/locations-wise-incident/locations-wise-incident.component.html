<div id="chart" class="report-piechart">
  <apx-chart #chart [series]="chartOptions.series" [chart]="chartOptions.chart" [yaxis]="chartOptions.yaxis"
    [xaxis]="chartOptions.xaxis" [stroke]="chartOptions.stroke" [dataLabels]="chartOptions.dataLabels"
    [fill]="chartOptions.fill" [tooltip]="chartOptions.tooltip" [noData]="chartOptions.noData!"></apx-chart>
</div>
