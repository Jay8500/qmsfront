<div id="chart" class="report-piechart">
    <apx-chart #chart [series]="chartOptions.series" [chart]="chartOptions.chart" [labels]="chartOptions.labels"
        [grid]="chartOptions.grid" [plotOptions]="chartOptions.plotOptions" [responsive]="chartOptions.responsive"
        [colors]="chartOptions.colors" [legend]="chartOptions.legend" [fill]="chartOptions.fill"
        [noData]="chartOptions.noData!">
    </apx-chart>
</div>
